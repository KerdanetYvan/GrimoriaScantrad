name: API Django CI
on: pull_request
jobs:
    detect_changes:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - name: Filtrage des changements
              uses: dorny/paths-filter@v4
              id: filter
              with:
                filters: |
                    api:
                        - apps/api/**
                        - .github/workflows/api-ci.yml
        outputs:
            api: ${{ steps.filter.outputs.api }}
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/api
        needs: detect_changes
        if: needs.detect_changes.outputs.api == 'true'
        env:
            SECRET_KEY: ci-only-not-secret
            DATABASE_URL: postgres://grimoria:grimoria@localhost:5432/postgres_grimoria
        services:
            postgres_grimoria:
                image: postgres:16
                env:
                    POSTGRES_USER: grimoria
                    POSTGRES_PASSWORD: grimoria
                    POSTGRES_DB: postgres_grimoria
                ports:
                    - "5432:5432"
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Récupération du code du projet
              uses: actions/checkout@v7
            - name: Installation de Python 3.12
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
            - name: Installation des dépendances
              run: pip install -r requirements.txt
            - name: Check de la cohérence de l'API
              run: python manage.py check
            - name: Exécution de Pytest
              run: pytest